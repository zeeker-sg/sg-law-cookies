name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (live tests excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v3 (uv 0.11.14)
        with:
          version: "0.11.14"
          python-version: "3.12"

      - name: Install dependencies (uv.lock)
        run: uv sync --locked

      # -m 'not live' is also set via addopts in pyproject.toml; repeating it
      # here keeps the exclusion explicit even if addopts ever changes.
      - name: Run test suite
        run: uv run pytest -m "not live" -q