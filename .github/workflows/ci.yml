name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (live tests excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies (uv.lock)
        run: uv sync --locked

      # -m 'not live' is also set via addopts in pyproject.toml; repeating it
      # here keeps the exclusion explicit even if addopts ever changes.
      - name: Run test suite
        run: uv run pytest -m "not live" -q